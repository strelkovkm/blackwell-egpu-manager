blacklist nouveau
blacklist lbm-nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
options nouveau modeset=0
options nvidia NVreg_DynamicPowerManagement=0x00 NVreg_RestrictProfilingToAdminUsers=0
options nvidia_drm modeset=0 fbdev=0
install nvidia_drm /bin/true
install nvidia-drm /bin/true
